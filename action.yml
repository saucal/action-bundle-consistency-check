name: "Consistency check"
description: "Check if the target built branch and remote filesystem are in sync."
inputs:
  built:
    description: "Previous build directory (needs to be repo and have a remote)"
    required: false
    default: 'built'
  env-host:
    description: "Env Host"
    required: true
    default: ''
  env-port:
    description: "Env Port"
    required: true
    default: '22'
  env-user:
    description: "Env User"
    required: true
    default: ''
  env-key:
    description: "Env SSH Key"
    required: false
    default: ''
  env-pass:
    description: "Env Password"
    required: false
    default: ''
  env-local-root:
    description: "Env Local Root (relative to the built directory)"
    required: false
    default: ''
  env-remote-root:
    description: "Env Remote Root"
    required: true
    default: ''
  ssh-flags:
    description: "SSH Flags to pass to the RSync command"
    required: false
    default: ''
  ssh-shell-params:
    description: "Parameters to be passed to the SSH shell command"
    required: false
    default: ''
  ssh-extra-options:
    description: "Extra options for the RSync command"
    required: false
    default: ''
  ssh-ignore:
    description: "Force ignore files"
    required: false
    default: 'false'
  ssh-ignore-extra:
    description: "Extra force ignore files over SSH. Useful to extend the default configuration."
    required: false
    default: 'false'
  slack-token:
    description: "Slack Token"
    required: false
    default: ''
  slack-channel:
    description: "Channel ID to publish the message on"
    required: false
    default: ''
  run-ssh-pre:
    description: "Determine if we are going to run the pre script"
    required: false
    default: 'true'
  run-ssh-post:
    description: "Determine if we are going to run the post script"
    required: false
    default: 'true'
  reconcile:
    description: "Set to '1' to attempt drift reconciliation (open a reconciliation-{ref} PR). Empty/0 disables."
    required: false
    default: ''
  source:
    description: "Source tree directory (where composer.json lives). Matches bundle-prepare's source input."
    required: false
    default: 'source'
  github-token:
    description: "Token with contents+pull-requests write on the source repo, used to push the branch and open the PR."
    required: false
    default: ''
  satispress-url:
    description: "Deprecated, no longer read. SatisPress resolution now goes through composer itself (composer show), authenticated via the auth.json action-composer-auth configures upstream in this job. Kept only for backward compatibility with existing callers."
    required: false
    default: 'https://packages.saucal.com'
  satispress-token:
    description: "Deprecated, no longer read. See satispress-url."
    required: false
    default: ''
  reconcile-adopt-non-composer:
    description: "Allow copying non-composer plugin/theme files into source (off by default)."
    required: false
    default: 'false'
  sapp-server:
    description: "ServiceApp host, for the known-vulnerability check (POST /wp-json/serviceapp/v1/vulns/match)."
    required: false
    default: 'maintenance.saucal.com'
  sapp-vulns-key:
    description: "ServiceApp API key with the vulns:match scope (preferred: least privilege)."
    required: false
    default: ''
  sapp-app-user:
    description: "ServiceApp app-password user, used for the vulnerability check when no vulns key is given."
    required: false
    default: ''
  sapp-app-pass:
    description: "ServiceApp app password (see sapp-app-user)."
    required: false
    default: ''

outputs:
  reconcile-head-sha:
    description: "Commit to verify/merge: the reconciliation PR head, or the checked branch itself when source already carries every fix. Empty when there is nothing to heal."
    value: ${{ steps.reconcile.outputs.head-sha }}
  reconcile-build-sha:
    description: "With commits not deployed yet: the heal built on the last deployed commit — what verify checks and the built repo gets. Empty otherwise."
    value: ${{ steps.reconcile.outputs.build-sha }}
  reconcile-base-sha:
    description: "Tip of the checked branch the reconciliation was cut from (merge only while it is still there)."
    value: ${{ steps.reconcile.outputs.base-sha }}
  reconcile-pr:
    description: "Reconciliation PR number."
    value: ${{ steps.reconcile.outputs.pr }}
  reconcile-auto-merge:
    description: "'true' when the heal needs no judgement: version moves of existing requires, core, and patches / committed-code copies whose delta raised no signal at all."
    value: ${{ steps.reconcile.outputs.auto-merge }}
  reconcile-pending-paths:
    description: "Newline-separated anchored paths the self-heal checks must not count this time (deferred, flagged or junk drift)."
    value: ${{ steps.reconcile.outputs.pending-paths }}
  reconcile-suspicious:
    description: "'true' when server-derived content carries signals of compromised code — never merge, alert a human."
    value: ${{ steps.reconcile.outputs.suspicious }}

runs:
  using: "composite"
  steps:
    - name: Pre-build Consistency check
      id: pre-build-consistency-check
      uses: saucal/action-deploy-ssh@v4
      with:
        env-host: ${{ inputs.env-host }}
        env-port: ${{ inputs.env-port }}
        env-user: ${{ inputs.env-user }}
        env-key: ${{ inputs.env-key }}
        env-pass: ${{ inputs.env-pass }}
        env-local-root: ${{ inputs.built }}/${{ inputs.env-local-root }}
        env-remote-root: ${{ inputs.env-remote-root }}
        force-ignore: ${{ inputs.ssh-ignore }}
        force-ignore-extra: ${{ inputs.ssh-ignore-extra }}
        ssh-flags: ${{ inputs.ssh-flags }}
        ssh-shell-params: ${{ inputs.ssh-shell-params }}
        ssh-extra-options: ${{ inputs.ssh-extra-options }}
        consistency-check: true
        run-pre: ${{ inputs.run-ssh-pre }}
        run-post: ${{ inputs.run-ssh-post }}

    - name: Compute artifact name prefix
      id: artifact-meta
      if: ${{ always() }}
      shell: bash
      env:
        FULL_REPO: ${{ github.repository }}
      run: echo "prefix=${FULL_REPO##*/}-$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

    - name: Upload rsync sync plan
      uses: actions/upload-artifact@v4
      if: ${{ always() && steps.pre-build-consistency-check.outputs.bufferPath }}
      with:
        name: ${{ steps.artifact-meta.outputs.prefix }}-deploy-rsync-plan
        if-no-files-found: ignore
        path: |
          ${{ steps.pre-build-consistency-check.outputs.bufferPath }}
          ${{ steps.pre-build-consistency-check.outputs.gitManifestPath }}
          ${{ steps.pre-build-consistency-check.outputs.manifestDiffPath }}

    - name: Upload consistency diffs
      uses: actions/upload-artifact@v4
      if: ${{ always() && steps.pre-build-consistency-check.outputs.diffPath }}
      with:
        name: ${{ steps.artifact-meta.outputs.prefix }}-consistency-diffs
        path: ${{ steps.pre-build-consistency-check.outputs.diffPath }}

    # Fixed some other way (a deploy, a manual sync): an open reconciliation PR is stale.
    - name: Close a stale reconciliation PR
      if: ${{ success() && inputs.reconcile == '1' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        REF: ${{ github.ref_name }}
        CLEANUP_ONLY: '1'
      run: node "$GITHUB_ACTION_PATH/reconcile/index.js"

    - name: Setup PHP + Composer for reconcile
      if: ${{ failure() && inputs.reconcile == '1' }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'  # preinstalled on ubuntu-latest (24.04): no install
        tools: composer
        coverage: none

    - name: Reconcile drift
      id: reconcile
      if: ${{ failure() && inputs.reconcile == '1' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        REF: ${{ github.ref_name }}
        SOURCE_DIR: ${{ inputs.source }}
        BUILT_DIR: ${{ inputs.built }}
        ADOPT_NON_COMPOSER: ${{ inputs.reconcile-adopt-non-composer }}
        MANIFEST_PATH: ${{ steps.pre-build-consistency-check.outputs.bufferPath }}
        DIFF_PATH: ${{ steps.pre-build-consistency-check.outputs.diffPath }}
        RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        SAPP_SERVER: ${{ inputs.sapp-server }}
        SAPP_VULNS_KEY: ${{ inputs.sapp-vulns-key }}
        SAPP_APP_USER: ${{ inputs.sapp-app-user }}
        SAPP_APP_PASS: ${{ inputs.sapp-app-pass }}
      # Composer SatisPress auth is configured upstream by action-prepare-composer (run via
      # action-bundle-prepare earlier in this same job), which writes source/auth.json. Every
      # composer call the reconcile makes runs in source/ and reads it — no auth setup here.
      run: node "$GITHUB_ACTION_PATH/reconcile/index.js"

    - name: Signal possible compromise to slack
      if: ${{ failure() && steps.reconcile.outputs.suspicious == 'true' }}
      uses: saucal/action-slack-notification@v1
      with:
        token: ${{ inputs.slack-token }}
        channel: ${{ inputs.slack-channel }}
        commit-repo: ${{ github.repository }}
        commit-branch: ${{ github.ref_name }}
        commit-author: ${{ github.triggering_actor }}
        heading: "Possible compromised code on the server"
        action-url: "${{ github.server_url }}/${{ github.repository }}/pull/${{ steps.reconcile.outputs.pr }}"
        force: true
        final-status: failure
        commit-message: |
          :rotating_light: @here Server drift on ${{ github.ref_name }} carries signals of compromised code: ${{ steps.reconcile.outputs.security-summary }}. Self-heal will NOT merge; review the reconciliation PR and the server as a possible incident.

    - name: Signal Failure to slack
      if: ${{ failure() }}
      uses: saucal/action-slack-notification@v1
      with:
        token: ${{ inputs.slack-token }}
        channel: ${{ inputs.slack-channel }}
        commit-repo: ${{ github.repository }}
        commit-branch: ${{ github.ref_name }}
        commit-author: ${{ github.triggering_actor }}
        heading: ${{ github.workflow }}
        action-url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        force: true
        final-status: "${{ steps.pre-build-consistency-check.outcome }}"
        data-file: ${{ steps.pre-build-consistency-check.outputs.bufferPath }}
        commit-message: |
          Consistency check failed @here
