name: "Consistency check"
description: "Check if the target built branch and remote filesystem are in sync."
inputs:
  built:
    description: "Previous build directory (needs to be repo and have a remote)"
    required: false
    default: 'built'
  env-host:
    description: "Env Host"
    required: true
    default: ''
  env-port:
    description: "Env Port"
    required: true
    default: '22'
  env-user:
    description: "Env User"
    required: true
    default: ''
  env-key:
    description: "Env SSH Key"
    required: false
    default: ''
  env-pass:
    description: "Env Password"
    required: false
    default: ''
  env-local-root:
    description: "Env Local Root (relative to the built directory)"
    required: false
    default: ''
  env-remote-root:
    description: "Env Remote Root"
    required: true
    default: ''
  ssh-flags:
    description: "SSH Flags to pass to the RSync command"
    required: false
    default: ''
  ssh-shell-params:
    description: "Parameters to be passed to the SSH shell command"
    required: false
    default: ''
  ssh-extra-options:
    description: "Extra options for the RSync command"
    required: false
    default: ''
  ssh-ignore:
    description: "Force ignore files"
    required: false
    default: 'false'
  ssh-ignore-extra:
    description: "Extra force ignore files over SSH. Useful to extend the default configuration."
    required: false
    default: 'false'
  slack-token:
    description: "Slack Token"
    required: false
    default: ''
  slack-channel:
    description: "Channel ID to publish the message on"
    required: false
    default: ''
  run-ssh-pre:
    description: "Determine if we are going to run the pre script"
    required: false
    default: 'true'
  run-ssh-post:
    description: "Determine if we are going to run the post script"
    required: false
    default: 'true'
  reconcile:
    description: "Set to '1' to attempt drift reconciliation (open a reconciliation-{ref} PR). Empty/0 disables."
    required: false
    default: ''
  source:
    description: "Source tree directory (where composer.json lives). Matches bundle-prepare's source input."
    required: false
    default: 'source'
  github-token:
    description: "Token with contents+pull-requests write on the source repo, used to push the branch and open the PR."
    required: false
    default: ''
  satispress-url:
    description: "SatisPress composer repo base URL, used to resolve premium plugins."
    required: false
    default: 'https://packages.saucal.com'
  satispress-token:
    description: "SatisPress HTTP Basic auth token (license key) used to resolve premium plugins."
    required: false
    default: ''
  reconcile-adopt-non-composer:
    description: "Allow copying non-composer plugin/theme files into source (off by default)."
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Pre-build Consistency check
      id: pre-build-consistency-check
      uses: saucal/action-deploy-ssh@v4
      with:
        env-host: ${{ inputs.env-host }}
        env-port: ${{ inputs.env-port }}
        env-user: ${{ inputs.env-user }}
        env-key: ${{ inputs.env-key }}
        env-pass: ${{ inputs.env-pass }}
        env-local-root: ${{ inputs.built }}/${{ inputs.env-local-root }}
        env-remote-root: ${{ inputs.env-remote-root }}
        force-ignore: ${{ inputs.ssh-ignore }}
        force-ignore-extra: ${{ inputs.ssh-ignore-extra }}
        ssh-flags: ${{ inputs.ssh-flags }}
        ssh-shell-params: ${{ inputs.ssh-shell-params }}
        ssh-extra-options: ${{ inputs.ssh-extra-options }}
        consistency-check: true
        run-pre: ${{ inputs.run-ssh-pre }}
        run-post: ${{ inputs.run-ssh-post }}

    - name: Compute artifact name prefix
      id: artifact-meta
      if: ${{ always() }}
      shell: bash
      env:
        FULL_REPO: ${{ github.repository }}
      run: echo "prefix=${FULL_REPO##*/}-$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

    - name: Upload rsync sync plan
      uses: actions/upload-artifact@v4
      if: ${{ always() && steps.pre-build-consistency-check.outputs.bufferPath }}
      with:
        name: ${{ steps.artifact-meta.outputs.prefix }}-deploy-rsync-plan
        if-no-files-found: ignore
        path: |
          ${{ steps.pre-build-consistency-check.outputs.bufferPath }}
          ${{ steps.pre-build-consistency-check.outputs.gitManifestPath }}
          ${{ steps.pre-build-consistency-check.outputs.manifestDiffPath }}

    - name: Upload consistency diffs
      uses: actions/upload-artifact@v4
      if: ${{ always() && steps.pre-build-consistency-check.outputs.diffPath }}
      with:
        name: ${{ steps.artifact-meta.outputs.prefix }}-consistency-diffs
        path: ${{ steps.pre-build-consistency-check.outputs.diffPath }}

    - name: Setup PHP + Composer for reconcile
      if: ${{ failure() && inputs.reconcile == '1' }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer
        coverage: none

    - name: Reconcile drift
      if: ${{ failure() && inputs.reconcile == '1' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        REF: ${{ github.ref_name }}
        SOURCE_DIR: ${{ inputs.source }}
        BUILT_DIR: ${{ inputs.built }}
        SATISPRESS_URL: ${{ inputs.satispress-url }}
        SATISPRESS_TOKEN: ${{ inputs.satispress-token }}
        ADOPT_NON_COMPOSER: ${{ inputs.reconcile-adopt-non-composer }}
        MANIFEST_PATH: ${{ steps.pre-build-consistency-check.outputs.bufferPath }}
        DIFF_PATH: ${{ steps.pre-build-consistency-check.outputs.diffPath }}
        RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      run: |
        # Authenticate composer against the private SatisPress repo the same way deployment does
        # (global auth.json, read by every later composer call). composer loads ALL repo metadata
        # on any update, so this is required even to add a wpackagist-only plugin.
        if [ -n "$SATISPRESS_TOKEN" ]; then
          host=$(printf '%s' "$SATISPRESS_URL" | sed -E 's,^https?://,,; s,/.*$,,')
          composer config --global --auth "http-basic.$host" "$SATISPRESS_TOKEN" "$host"
        fi
        node "$GITHUB_ACTION_PATH/reconcile/index.js"

    - name: Signal Failure to slack
      if: ${{ failure() }}
      uses: saucal/action-slack-notification@v1
      with:
        token: ${{ inputs.slack-token }}
        channel: ${{ inputs.slack-channel }}
        commit-repo: ${{ github.repository }}
        commit-branch: ${{ github.ref_name }}
        commit-author: ${{ github.triggering_actor }}
        heading: ${{ github.workflow }}
        action-url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        force: true
        final-status: "${{ steps.pre-build-consistency-check.outcome }}"
        data-file: ${{ steps.pre-build-consistency-check.outputs.bufferPath }}
        commit-message: |
          Consistency check failed @here
